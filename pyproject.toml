[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumalock-ai"
version = "0.1.0"
description = "Local, non-destructive photo editor with identity-aware editing"
requires-python = ">=3.11,<3.14"
dependencies = ["aiohttp>=3.10,<4", "filelock>=3.16,<4", "numpy>=1.26,<3", "Pillow>=11,<13", "opencv-python-headless>=4.10,<5", "pydantic>=2.10,<3", "PyYAML>=6,<7", "platformdirs>=4,<5", "psutil>=6,<8", "scipy>=1.14,<2", "scikit-image>=0.25,<1"]

[project.optional-dependencies]
ai = ["llama-cpp-python>=0.3.36,<0.4", "torch>=2.6", "torchvision>=0.21", "transformers>=4.51,<5", "huggingface-hub>=0.30,<1", "hf_xet>=1.7,<2", "gguf>=0.13.0", "requests>=2.32,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
